name: Secret Scan

on:
  push:
    branches:
      - main
      - feat/**

  workflow_dispatch:

jobs:
  trufflehog:
    name: Detect Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified=false
